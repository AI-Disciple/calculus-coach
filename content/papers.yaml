  presentation: as-printed
  title: Final 2 December 2022
  year: 2022
  durationMinutes: 180
  totalPoints: 18
  allowedMaterial: Nothing accepted except one sheet of handwritten notes.
  source: Exam Analysis, 2 December 2022, 9:00 to 12:00.
  blocks:
    - id: ex1
      title: Steepest decrease
      points: 1
      minutes: 10
      exercises: [l5-steepest-ascent.final-2022-q1]
      rubric:
        - text: The unit vector of steepest decrease and the rate are stated.
          points: 1
          exercise: l5-steepest-ascent.final-2022-q1
    - id: ex2
      title: Tangent plane
      points: 1
      minutes: 10
      exercises: [l5-tangent-plane.final-2022-q2]
      rubric:
        - text: The tangent plane at the given point is stated.
          points: 1
          exercise: l5-tangent-plane.final-2022-q2
    - id: ex3
      title: Chain rule and tangent plane
      points: 2
      minutes: 20
      exercises:
        - l5-chain-rule-path.final-2022-q3a
        - l5-tangent-plane.final-2022-q3b
        - l5-chain-rule-general.final-2022-q3c
      rubric:
        - text: \(\varphi'(t)\) is computed by the chain rule.
          points: 0.5
          exercise: l5-chain-rule-path.final-2022-q3a
        - text: The tangent plane to \(z = f\) at \((2, 1)\) is stated.
          points: 0.5
          exercise: l5-tangent-plane.final-2022-q3b
        - text: The Jacobian of \(N\) and the gradient of \(\psi\) are computed.
          points: 1
          exercise: l5-chain-rule-general.final-2022-q3c
    - id: ex4
      title: Critical points of the cubic
      points: 2
      minutes: 20
      exercises: [l6-second-derivative-test.final-2022-q4]
      rubric:
        - text: The three critical points are found and classified, with the section \(f(0, y)\) where \(D = 0\).
          points: 2
          exercise: l6-second-derivative-test.final-2022-q4
    - id: ex5
      title: Circle of critical points
      points: 3
      minutes: 30
      exercises:
        - l6-critical-points.final-2022-q5a
        - l6-second-derivative-test.final-2022-q5b
        - l6-degenerate-case.final-2022-q5c
        - l6-degenerate-case.final-2022-q5d
      rubric:
        - text: The origin and the unit circle are found.
          points: 1
          exercise: l6-critical-points.final-2022-q5a
        - text: \(D\) is computed at each critical point.
          points: 0.5
          exercise: l6-second-derivative-test.final-2022-q5b
        - text: The sections \(g\) and \(h\) are described.
          points: 0.5
          exercise: l6-degenerate-case.final-2022-q5c
        - text: Each critical point is classified.
          points: 1
          exercise: l6-degenerate-case.final-2022-q5d
    - id: ex6
      title: Average value
      points: 2
      minutes: 20
      exercises: [l7-average-value.final-2022-q6]
      rubric:
        - text: The average on the triangle is \(2\sin 1 - \sin 2\).
          points: 2
          exercise: l7-average-value.final-2022-q6
    - id: ex7
      title: Exponential probability
      points: 5
      minutes: 50
      exercises:
        - outside-current-course.final-2022-q7a
        - outside-current-course.final-2022-q7b
        - outside-current-course.final-2022-q7c
      rubric:
        - text: \(P(X > a, Y > b)\) is computed.
          points: 1
          exercise: outside-current-course.final-2022-q7a
        - text: \(P(aX + bY < t)\) and the density of \(aX + bY\) are computed.
          points: 2
          exercise: outside-current-course.final-2022-q7b
        - text: The expectation of \(\sqrt{X + Y}\) is computed.
          points: 2
          exercise: outside-current-course.final-2022-q7c
    - id: ex8
      title: Volume in a cylinder
      points: 2
      minutes: 20
      exercises: [l8-volumes-between-surfaces.final-2022-q8]
      rubric:
        - text: The volume and the limit of \(V/R\) are computed.
          points: 2
          exercise: l8-volumes-between-surfaces.final-2022-q8

- id: retake-2023
  kind: mock
  presentation: as-printed
  title: Retake January 2023
  year: 2023
  durationMinutes: 120
  totalPoints: 20
  allowedMaterial: Closed-book exam. No electronic devices.
  source: Retake Analysis, January 2023, two hours.
  blocks:
    - id: ex1
      title: Tangent planes parallel to a given plane
      points: 3
      minutes: 18
      exercises:
        - l5-tangent-plane.retake-2023-q1a
        - l5-tangent-plane.retake-2023-q1b
      rubric:
        - text: The tangent plane at a general point of the surface is stated.
          points: 2
          exercise: l5-tangent-plane.retake-2023-q1a
        - text: The points where that plane is parallel to \(x + y + z = 0\) are found.
          points: 1
          exercise: l5-tangent-plane.retake-2023-q1b
    - id: ex2
      title: Critical points of \(x^3 + xy + y^2\)
      points: 2
      minutes: 12
      exercises: [l6-second-derivative-test.retake-2023-q2]
      rubric:
        - text: The critical points are found and classified.
          points: 2
          exercise: l6-second-derivative-test.retake-2023-q2
    - id: ex3
      title: A degenerate critical point
      points: 3
      minutes: 18
      exercises: [l6-degenerate-case.retake-2023-q3]
      rubric:
        - text: The critical points are classified with the section \(f(x, 0)\).
          points: 3
          exercise: l6-degenerate-case.retake-2023-q3
    - id: ex4
      title: Polar integral
      points: 3
      minutes: 18
      exercises: [l7-polar-integrals.retake-2023-q4]
      rubric:
        - text: The integral of \(\sqrt{x^2 + y^2}\) on the quarter disk is computed.
          points: 3
          exercise: l7-polar-integrals.retake-2023-q4
    - id: ex5
      title: Substitution on a triangle
      points: 3
      minutes: 18
      exercises: [l8-change-of-variables.retake-2023-q5]
      rubric:
        - text: The integral of \((x + y)e^{x - y}\) is computed.
          points: 3
          exercise: l8-change-of-variables.retake-2023-q5
    - id: ex6
      title: Largest box in \(x^4 + y^4 + z^2 \le 1\)
      points: 3
      minutes: 18
      exercises: [l6-lagrange.retake-2023-q6]
      rubric:
        - text: The dimensions of the largest box are found.
          points: 3
          exercise: l6-lagrange.retake-2023-q6
    - id: ex7
      title: Volume between a paraboloid and a cone
      points: 3
      minutes: 18
      exercises: [l8-volumes-between-surfaces.retake-2023-q7]
      rubric:
        - text: The cross section in the \(xz\)-plane is described and the volume is computed.
          points: 3
          exercise: l8-volumes-between-surfaces.retake-2023-q7

