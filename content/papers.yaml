- id: midterm-2021
  kind: checkpoint
  presentation: as-printed
  title: Midterm 2021
  year: 2021
  durationMinutes: 90
  totalPoints: 18
  allowedMaterial: No documents. No electronic devices.
  source: Past midterm, 8 October 2021. Solutions written for this site. The paper prints no point values. Each marked part counts as 1 point so the checkpoint can be self-marked.
  blocks:
    - id: ex1
      title: Topographic map
      points: 2
      minutes: 12
      exercises:
        - l4-level-sets.midterm-2021-ex1a
        - l4-level-sets.midterm-2021-ex1b
      rubric:
        - text: The contour step is read from the printed 200 and 220 labels and the unlabeled curve between them.
          points: 1
          exercise: l4-level-sets.midterm-2021-ex1a
        - text: Tops, the saddle, and the bottom of the range are placed on the 100 m grid with heights from the contour step.
          points: 1
          exercise: l4-level-sets.midterm-2021-ex1b
    - id: ex2
      title: The cone
      points: 6
      minutes: 25
      exercises:
        - l4-cross-sections.midterm-2021-ex2.1
        - l4-level-sets.midterm-2021-ex2.2
        - l4-quadrics.midterm-2021-ex2.3
        - l4-cross-sections.midterm-2021-ex2.4
        - l4-cross-sections.midterm-2021-ex2.5
        - l4-cross-sections.midterm-2021-ex2.6
      rubric:
        - text: Cut by x = 0 is z^2 = y^2, two lines in Oyz.
          points: 1
          exercise: l4-cross-sections.midterm-2021-ex2.1
        - text: Level set z = c is the circle x^2 + y^2 = c^2. The map is concentric circles.
          points: 1
          exercise: l4-level-sets.midterm-2021-ex2.2
        - text: The surface is a double cone along Oz with vertex at the origin.
          points: 1
          exercise: l4-quadrics.midterm-2021-ex2.3
        - text: Cut by x = 1 is the hyperbola z^2 - y^2 = 1 with asymptotes z = \pm y.
          points: 1
          exercise: l4-cross-sections.midterm-2021-ex2.4
        - text: Cut by z = y + 1 projects in Oxy as the parabola x^2 = 2y + 1.
          points: 1
          exercise: l4-cross-sections.midterm-2021-ex2.5
        - text: Cut by z = 2y + 1 is a hyperbola. Asymptotes x = \pm\sqrt{3}(y + 2/3).
          points: 1
          exercise: l4-cross-sections.midterm-2021-ex2.6
    - id: ex3
      title: The curve x^4 + y^4 = 1
      points: 3
      minutes: 15
      exercises:
        - l2-curve-sketching.midterm-2021-ex3.1
        - l2-curve-sketching.midterm-2021-ex3.2
        - l2-curve-sketching.midterm-2021-ex3.3
      rubric:
        - text: The points with x = y and with y = 0 are computed.
          points: 1
          exercise: l2-curve-sketching.midterm-2021-ex3.1
        - text: Axis, origin, and diagonal symmetries are named, and the rounded square is sketched.
          points: 1
          exercise: l2-curve-sketching.midterm-2021-ex3.2
        - text: The parameterization is checked and theta is placed in (0, pi/2).
          points: 1
          exercise: l2-curve-sketching.midterm-2021-ex3.3
    - id: ex4
      title: The quotient (x^2 - y^2)/(x^2 + y^2)
      points: 3
      minutes: 18
      exercises:
        - l4-cross-sections.midterm-2021-ex4.1
        - l4-level-sets.midterm-2021-ex4.2
        - l5-limits-continuity.midterm-2021-ex4.3
      rubric:
        - text: The vertical cut is z = cos(2 theta), independent of r. The cut at -theta has the same height.
          points: 1
          exercise: l4-cross-sections.midterm-2021-ex4.1
        - text: Level sets are lines through the origin, drawn in space at the corresponding height.
          points: 1
          exercise: l4-level-sets.midterm-2021-ex4.2
        - text: Continuity at the origin is decided from directional limits.
          points: 1
          exercise: l5-limits-continuity.midterm-2021-ex4.3
    - id: ex5
      title: Product exponential density
      points: 4
      minutes: 20
      exercises:
        - l3-probability-densities.midterm-2021-ex5.1
        - l3-probability-densities.midterm-2021-ex5.2
        - l3-probability-densities.midterm-2021-ex5.3
        - l5-limits-continuity.midterm-2021-ex5.4
      rubric:
        - text: ln(g) = -x - y on the open first quadrant, with parallel level lines x + y = constant.
          points: 1
          exercise: l3-probability-densities.midterm-2021-ex5.1
        - text: The contour map of ln(g) is drawn, with symmetry across y = x.
          points: 1
          exercise: l3-probability-densities.midterm-2021-ex5.2
        - text: The graph of g is sketched for x > 0, y > 0.
          points: 1
          exercise: l3-probability-densities.midterm-2021-ex5.3
        - text: The limit of g at (ln(3/2), ln 2) is 1/3.
          points: 1
          exercise: l5-limits-continuity.midterm-2021-ex5.4
