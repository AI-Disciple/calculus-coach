      - { id: "item-07", label: Let y vary on the slice x=0; let x vary on y=0, nodes: [l4-cross-sections] }
      - { id: "item-08", label: "In 1D a graph is a line, in 2D a surface", nodes: [l4-graphs-planes] }
      - { id: "item-09", label: "If z = f(x,y) = 0, the graph is the plane (xy)", nodes: [l4-graphs-planes] }
      - { id: "item-10", label: "Plane z = ax + by + C, height C on the z-axis", nodes: [l4-graphs-planes] }
      - { id: "item-11", label: "When x=y=0, f(0,0)=C on the z-axis", nodes: [l4-graphs-planes] }
      - { id: "item-12", label: "Quadrics: surfaces defined by a 2nd-order polynomial", nodes: [l4-quadrics] }
      - { id: "item-13", label: Paraboloid z = x^2 + y^2, nodes: [l4-quadrics] }
      - { id: "item-14", label: "Sphere z = +- sqrt(1 - x^2 - y^2)", nodes: [l4-quadrics] }
      - { id: "item-15", label: "Cone z = +- sqrt(x^2 + y^2)", nodes: [l4-quadrics] }
      - { id: "item-16", label: "Two-sheet hyperboloid z = +- sqrt(x^2 + y^2 + 1)", nodes: [l4-quadrics] }
      - { id: "item-17", label: Cone through the origin in Oxyz, nodes: [l4-quadrics] }
      - { id: "item-18", label: "Two-sheet hyperboloid, two nappes", nodes: [l4-quadrics] }
      - { id: "item-19", label: "Hyperbolic paraboloid z = x^2 - y^2", nodes: [l4-quadrics] }
      - { id: "item-20", label: "Saddle, one branch drawn red, x^2 circled", nodes: [l4-quadrics] }
      - { id: "item-21", label: "One-sheet hyperboloid z^2 = x^2 + y^2 - 1", nodes: [l4-quadrics] }
      - { id: "item-22", label: "Radius >= 1, thus outside the throat", nodes: [l4-quadrics] }
      - { id: "item-23", label: "One-sheet hyperboloid, throat marked", nodes: [l4-quadrics] }
      - { id: "item-24", label: "Exercise 2: name five surfaces (sheet 2)", nodes: [l4-quadrics] }
      - { id: "item-25", label: z = x^2 + y^2 is a paraboloid, nodes: [l4-quadrics] }
      - { id: "item-26", label: "x^2 + y^2 + z^2 = 1, implicit sphere", nodes: [l4-quadrics] }
      - { id: "item-27", label: "z^2 = -1 + x^2 + y^2 called 2-sheet", nodes: [l4-quadrics] }
      - { id: "item-28", label: "z^2 = -(1 + x^2 + y^2) called 1-sheet", nodes: [l4-quadrics] }
      - { id: "item-29", label: "z = x^2 - y^2, hyperbolic paraboloid", nodes: [l4-quadrics] }
      - { id: "item-30", label: Cross section of z=f by another z=g, nodes: [l4-cross-sections] }
      - { id: "item-31", label: "The set of (x,y) with g(x,y) = f(x,y)", nodes: [l4-cross-sections] }
      - { id: "item-32", label: "x=0 cuts by (O,y,z); y=0 by (O,x,z)", nodes: [l4-cross-sections] }
      - { id: "item-33", label: "Bowl cut by a red vertical plane, axes z, x, y", nodes: [l4-cross-sections] }
