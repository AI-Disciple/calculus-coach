  - source: lecture-notes-1
    items:
      - { id: "item-01", label: "Unit circle r=1, sin vertical, cos horizontal, 2pi circumference", page: 1, nodes: [l1-trigonometry] }
      - { id: "item-02", label: "Need-to-know: sin/cos at 0, pi, pi/2, -pi/2", page: 1, nodes: [l1-trigonometry] }
      - { id: "item-03", label: tan(alpha) = sin(alpha)/cos(alpha), page: 1, nodes: [l1-trigonometry] }
      - { id: "item-04", label: "Radians: circle with a vertical orange chord, unlabeled", page: 1, nodes: [l1-trigonometry] }
      - { id: "item-05", label: "Graph of sin on [0, 2pi] with ticks pi/2, pi, 3pi/2, 2pi", page: 1, nodes: [l1-trigonometry] }
      - { id: "item-06", label: "Odd function: f(-x) = -f(x); sin is odd", page: 1, nodes: [l1-transformations] }
      - { id: "item-07", label: "ln(x) = log_e(x), ln(e) = 1, log_a(a) = 1", page: 1, nodes: [l1-exp-log] }
      - { id: "item-08", label: "Change of base: log_a(x) = ln(x)/ln(a)", page: 1, nodes: [l1-exp-log] }
      - { id: "item-09", label: "Reminder: log(1) = 0", page: 1, nodes: [l1-exp-log] }
      - { id: "item-10", label: lim f(g(x)) = f(lim g(x)) if f is continuous, page: 2, nodes: [l1-limits, l1-continuity] }
      - { id: "item-11", label: f has limit L at x0 if f(x) approaches L as x approaches x0, page: 2, nodes: [l1-limits] }
      - { id: "item-12", label: f continuous at x0 if that L equals f(x0), page: 2, nodes: [l1-continuity] }
      - { id: "item-13", label: "Jump at x0: lim f = L != f(x0), hence discontinuous", page: 2, nodes: [l1-continuity] }
      - { id: "item-14", label: "lim (f+g) = lim f + lim g, unless +inf + (-inf), then N.A.", page: 2, nodes: [l1-limits] }
      - { id: "item-15", label: "lim_{x->0+} x ln(x) = 0 and lim_{x->+inf} x^r e^{-x} = 0", page: 2, nodes: [l1-limit-techniques] }
      - { id: "item-16", label: "f: R -> R differentiable at x0 if lim (f(x)-f(x0))/(x-x0) exists", page: 2, nodes: [l1-derivative] }
      - { id: "item-17", label: "Derivative written f'(x0), overdot f(x0), or df/dx (x0). Steepness of f", page: 2, nodes: [l1-derivative] }
      - { id: "item-18", label: "f'(x0) = tan(alpha), alpha the angle of the curve with the x-axis", page: 2, nodes: [l1-derivative] }
      - { id: "item-19", label: "Tangent: t(x) = f'(x0)(x-x0) + f(x0), with t(x0)=f(x0), t'(x0)=f'(x0)", page: 2, nodes: [l1-derivative] }
      - { id: "item-20", label: "(x^n)' = n x^{n-1} for n in N", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-21", label: "Real power: f(x)=x^p (p real, x>0), derivative written without a prime", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-22", label: "sin' = cos, cos' = -sin", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-23", label: "(e^x)' = e^x, (ln x)' = 1/x, (1/u)' = -u'/u^2", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-24", label: "Sum: (f+g)' = f'+g'. Product: (fg)' = f'g + f g'", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-25", label: "Chain: (f(g(x)))' = f'(g(x)) * g'(x)", page: 3, nodes: [l1-derivative-rules] }
      - { id: "item-26", label: "Quotient: d/dx [f/g] = (g f' - f g') / (g(x))^2", page: 3, nodes: [l1-derivative-rules] }
  - source: lecture-notes-2
    items:
      - { id: "item-01", label: "Inverse of f(x)=x^2=y: f^{-1}: y -> +-sqrt(y), two branches", page: 1, nodes: [l2-inverse-functions] }
      - { id: "item-02", label: "Says f^{-1} is well defined for x>=0 (meant y>=0)", page: 1, nodes: [l2-inverse-functions] }
      - { id: "item-03", label: "(f^{-1})'(y) = 1 / f'(f^{-1}(y)), from the chain rule", page: 1, nodes: [l2-inverse-functions] }
      - { id: "item-04", label: "Sketch: f'=0, sign of f', zeros of f, intercepts, then asymptotes", page: 1, nodes: [l2-curve-sketching] }
      - { id: "item-05", label: "Asymptote at +inf: linear t with lim_{x->inf} f(x)/t(x) = 1", page: 1, nodes: [l2-asymptotes] }
      - { id: "item-06", label: "Vertical asymptote at finite x0 if lim_{x->x0} f = inf", page: 1, nodes: [l2-asymptotes] }
      - { id: "item-07", label: Curve rising beside a vertical line at x0, page: 1, nodes: [l2-asymptotes] }
      - { id: "item-08", label: "L'Hopital 0/0: f,g differentiable at a, g'(a)!=0, then lim f/g = lim f'/g'", page: 2, nodes: [l2-lhopital] }
      - { id: "item-09", label: "lim_{x->0} sin(x)/x (stated, not evaluated)", page: 2, nodes: [l2-lhopital, l1-limit-techniques] }
      - { id: "item-10", label: "Critical point: f'(x)=0, hence a horizontal tangent", page: 2, nodes: [l2-monotonicity-extrema] }
      - { id: "item-11", label: "At a crit. point: f''>0 local min (convex), f''<0 local max (concave)", page: 2, nodes: [l2-concavity] }
      - { id: "item-12", label: "Inflection if f''=0, listed as a third case at a crit. point", page: 2, nodes: [l2-concavity] }
      - { id: "item-13", label: "Newton to approximate a root x*: tangent at x_k, next iterate its root", page: 2, nodes: [l2-newton] }
      - { id: "item-14", label: "Boxed Newton: if f'(x_k)!=0 then x_{k+1} = x_k - f(x_k)/f'(x_k)", page: 2, nodes: [l2-newton] }
      - { id: "item-15", label: "Quadratic error |x_{k+1}-x*| <= C |x_k-x*|^2, and lim x_k = x*", page: 2, nodes: [l2-newton] }
      - { id: "item-16", label: "Newton tangents from x0 toward a root x*", page: 2, nodes: [l2-newton] }
      - { id: "item-17", label: "Tangent line written y(a) = f(x_k) + f'(x_k)(x-x_k)", page: 2, nodes: [l2-newton] }
      - { id: "item-18", label: "IVT: if f is continuous, f takes all values between f(a) and f(b) on [a,b]", page: 3, nodes: [l2-ivt] }
  - source: lecture-notes-3
    items:
      - { id: "item-01", label: "Ex 8: f(x)=(x-1)^2 (x+3)^{2/3}, they take D(f)=R", page: 1, nodes: [l2-curve-sketching, l3-real-powers] }
      - { id: "item-02", label: "(x^{1/3})^3 = x, to justify real cube roots", page: 1, nodes: [l3-real-powers] }
      - { id: "item-03", label: "Real power: x^alpha = e^{alpha ln x} for alpha real (needs x>0)", page: 1, nodes: [l3-real-powers] }
      - { id: "item-04", label: "f'(x) = lim_{delta x->0} [f(x+delta x)-f(x)] / delta x", page: 1, nodes: [l1-derivative] }
      - { id: "item-05", label: "Increment delta x on the graph, slope marked f'(x)", page: 1, nodes: [l1-derivative] }
      - { id: "item-06", label: "First-order Taylor: f(x+delta x)=f(x)+delta x f'(x) + (delta x)*(small)", page: 1, nodes: [l3-taylor] }
      - { id: "item-07", label: "Order-n Taylor: sum_{k=0}^n (delta x)^k / k! * f^{(k)}(x) + small*(delta x)^n", page: 1, nodes: [l3-taylor] }
      - { id: "item-08", label: "Taylor of g(y)=sqrt(1+y): g'=1/(2 sqrt(1+y)), g''=-(1/4)(1+y)^{-3/2}", page: 2, nodes: [l3-taylor] }
      - { id: "item-09", label: "sqrt(1+y) = 1 + y/2 - y^2/8 + y^2*small", page: 2, nodes: [l3-taylor] }
      - { id: "item-10", label: "Then f(x)=1 + x^2/2 - x^4/8 + x^4*small (y=x^2, not labeled)", page: 2, nodes: [l3-taylor-composition] }
      - { id: "item-11", label: "int_a^b f(x) dx is the area under the curve above the x-axis on [a,b]", page: 3, nodes: [l3-riemann-sums] }
      - { id: "item-12", label: "Riemann sum: lim (b-a)/n Sigma_{j=0}^{n-1} f(a + (b-a)j/n)", page: 3, nodes: [l3-riemann-sums] }
      - { id: "item-13", label: "Partition rectangles from a to b, height f(a+(b-a)i/n)", page: 3, nodes: [l3-riemann-sums] }
      - { id: "item-14", label: "Antiderivative: (int f)' = f. Example: ln is an antiderivative of 1/x", page: 3, nodes: [l3-fundamental-theorem] }
      - { id: "item-15", label: "FTC: f continuous on [a,b], F'=f, then int_a^b f = F(b)-F(a)", page: 3, nodes: [l3-fundamental-theorem] }
      - { id: "item-16", label: "int_{-1}^1 sin x dx = [-cos x]_{-1}^1 = 0", page: 3, nodes: [l3-fundamental-theorem] }
      - { id: "item-17", label: "Parts: int f g' = [f g]_a^b - int f' g, from (fg)' = f'g + f g'", page: 3, nodes: [l3-integration-by-parts] }
      - { id: "item-18", label: "Density on [0,inf): int_0^inf f=1, E(x)=int_0^inf x f(x) dx, P(X>2)=int_2^inf f", page: 4, nodes: [l3-probability-densities] }
      - { id: "item-19", label: "Improper integral: replace inf by L, then take lim_{L->inf}", page: 4, nodes: [l3-improper-integrals] }
      - { id: "item-20", label: "Substitution: int_a^b f(phi(x)) phi'(x) dx = int_{phi(a)}^{phi(b)} f(y) dy", page: 4, nodes: [l3-substitution] }
      - { id: "item-21", label: "int_0^1 sqrt(1-y^2) dy via y=sin x equals pi/4", page: 4, nodes: [l3-substitution, l3-trig-integrals] }
      - { id: "item-22", label: Blank page, page: 5, excluded: This page of the lecture notes is blank. }
  - source: lecture-notes-5
    items:
      - { id: "item-01", label: "f: R^n -> R has limit L at x0 if ||x-x0||->0 implies |f(x)-L|->0", page: 1, nodes: [l5-limits-continuity] }
      - { id: "item-02", label: Continuity at x0 if also L = f(x0), page: 1, nodes: [l5-limits-continuity] }
      - { id: "item-03", label: Several paths in the plane approaching x0, page: 1, nodes: [l5-limits-continuity] }
      - { id: "item-04", label: "Graph of f over (x1,x2), value f(x0) marked", page: 1, nodes: [l4-graphs-planes, l5-limits-continuity] }
      - { id: "item-05", label: "Partial in x: lim_{eps->0} [f(x+eps,y)-f(x,y)]/eps, written df/dx or d_x f or f_x", page: 1, nodes: [l5-partial-derivatives] }
      - { id: "item-06", label: "Partial in y: lim_{eps->0} [f(x,y+eps)-f(x,y)]/eps, written df/dy or d_y f or f_y", page: 1, nodes: [l5-partial-derivatives] }
      - { id: "item-07", label: "df/dx is slope in the x direction, df/dy slope in the y direction", page: 2, nodes: [l5-partial-derivatives] }
      - { id: "item-08", label: "Tangent plane: Z = f(x0,y0) + (x-x0) df/dx(x0,y0) + (y-y0) df/dy(x0,y0)", page: 2, nodes: [l5-tangent-plane] }
      - { id: "item-09", label: "Tangent plane to a surface, labeled in blue", page: 2, nodes: [l5-tangent-plane] }
      - { id: "item-10", label: "Directional df(x,y ; u) = lim_{eps->0} [f((x,y)+eps u) - f(x,y)] / eps, u=(a,b)", page: 2, nodes: [l5-directional-derivative] }
      - { id: "item-11", label: "df(x,y ; u) = a * df/dx + b * df/dy", page: 2, nodes: [l5-directional-derivative] }
      - { id: "item-12", label: "Gradient grad f(x,y) = (d_x f(x,y), d_y f(x,y)) as a column", page: 2, nodes: [l5-directional-derivative] }
      - { id: "item-13", label: "df(x,y ; u) = grad f(x,y) * u, scalar product in R^2", page: 2, nodes: [l5-directional-derivative] }
      - { id: "item-14", label: "Directional derivative as a slope in the (d_x f, d_y f) plane", page: 2, nodes: [l5-directional-derivative] }
      - { id: "item-15", label: "A map R -> R^n parametrizes a curve. Same image, different speed", page: 3, nodes: [l5-chain-rule-path] }
      - { id: "item-16", label: "Line x=t+1, y=t i.e. x=y+1. Parabola x=t, y=t^2, with M(1)=(1,1)", page: 3, nodes: [l5-chain-rule-path] }
      - { id: "item-17", label: "Warning: t -> (t^2, t^4) traces the same parabola with different speed", page: 3, nodes: [l5-chain-rule-path] }
      - { id: "item-18", label: "Chain rule: h(t)=f(M(t)), then h'(t) = grad f(M(t)) * dM/dt", page: 3, nodes: [l5-chain-rule-path] }
      - { id: "item-19", label: "Clairaut: d(df)/dy(dx) = d(df)/dx(dy) if f is twice differentiable", page: 4, nodes: [l5-higher-derivatives] }
      - { id: "item-20", label: "f(x,y)=x^2+xy, f_x=2x+y, f_xy=1, f_y=x, f_yx=1", page: 4, nodes: [l5-higher-derivatives] }
      - { id: "item-21", label: "Hessian H_f = [[d^2f/dx^2, d^2f/dx dy], [d^2f/dx dy, d^2f/dy^2]]. Crit. point: grad f=0", page: 4, nodes: [l5-hessian, l6-critical-points] }
      - { id: "item-22", label: "D=det H_f. Test: f_xx>=0 min, f_xx<=0 max, D<0 saddle, D=0 unknown", page: 4, nodes: [l6-second-derivative-test, l6-degenerate-case] }
  - source: lecture-notes-6
    items:
      - { id: "item-01", label: "Tangent plane to an implicit surface f(x,y,z)=0: a curve on the surface gives grad f . (x',y',z') = 0", page: 1, nodes: [l5-tangent-plane] }
      - { id: "item-02", label: "Tangent plane (x-x0) f_x + (y-y0) f_y + (z-z0) f_z = 0, grad f is the normal", page: 1, nodes: [l5-tangent-plane] }
      - { id: "item-03", label: "Tangent plane to x^2+y^2+z^2=4 at (1,1,sqrt2) is x+y+sqrt2 z=4", page: 2, nodes: [l5-tangent-plane] }
      - { id: "item-04", label: "f=x^2+y^2+kxy: D=4-k^2, D=0 at k=+-2, f=(x+y)^2 gives a line of minima", page: 2, nodes: [l6-parameter-families, l6-degenerate-case] }
      - { id: "item-05", label: "f=48x+96y-x^2-2xy-9y^2: critical point (21,3), D=32, f_xx<0, maximum", page: 3, nodes: [l6-global-extrema, l6-second-derivative-test] }
      - { id: "item-06", label: "Optimisation on a rectangle: if the critical point fails the test, the extremum lies on one of the four sides", page: 3, nodes: [l6-global-extrema] }
      - { id: "item-07", label: "Quadratic with one maximum outside the region has its maximum on the side nearest to it", page: 3, nodes: [l6-global-extrema] }
      - { id: "item-08", label: "Max f subject to x+y+z=1 by substituting z=1-x-y", page: 4, nodes: [l6-worded-optimisation, l6-lagrange] }
      - { id: "item-09", label: "Box of volume 1/2 with minimal surface area 2(xy+yz+xz)", page: 4, nodes: [l6-lagrange] }
      - { id: "item-10", label: "Euler-Lagrange theorem with N constraints and linearly independent gradients", page: 4, nodes: [l6-lagrange] }
      - { id: "item-11", label: "Single constraint: grad f = lambda grad G", page: 5, nodes: [l6-lagrange] }
