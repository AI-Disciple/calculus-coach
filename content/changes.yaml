  title: Lecture 2 optimisation, Newton and the theorems
  text: |
    One-variable optimisation, Newton's method, the intermediate value theorem, the mean value theorem, related rates and linear approximation now have course statements, worked and guided examples, traps, cards, sheet items and a three-tier exercise ladder. Those six nodes are reviewed.

    Optimisation evaluates the function at critical values and at the endpoints, and a word problem writes the quantity before any derivative. Newton's method keeps exact fractions and ends with an error sentence. The cube root of 9, started at 2, has first iterate 25/12 and reads 2.08 to two decimal places. The two-car related rate is 460 over the square root of 13 kilometres per hour, and the distance is increasing.
