- date: "2026-10-09"
  title: Midterm questions, cards and curve write-ups
  text: |
    The multiple-choice questions and cards from the midterm revision app are on the lecture 1 to 3 nodes, in the course notation. Four level-set questions were left off those nodes. Level sets of a function of two variables belong with lecture 4.
    Question 58 was dropped. The stem depends on a graph that a concept question cannot carry.
    Question 5 was fixed. The original was tick-all with three correct identities. Rewritten so one option lists those three, and the others mix in the false rule that exp(a+b) equals exp(a)+exp(b). Question 7 was fixed. The option that shifted sin x by pi describes the same curve as -sin x, so two options were correct. That option is now a shift by pi/2. Question 49 was fixed. The keyed option said the third iterate was exact to machine precision. The error is about 10^{-12}. Question 34 was fixed. The original wrote n! and named the Gamma function without saying n is a non-negative integer. Question 60 was fixed. The original checklist put intercepts before the derivative and inflection before asymptotes. The exam marking order is domain, derivative, sign chart, asymptotes, intercepts, inflection if asked, conclusion. Question 63 was fixed. The original said closed region and the whole boundary. The one-variable statement uses a closed interval and its endpoints. l2-curve-sketching.curve-02 was fixed. The source places the positive derivative on the closed interval beginning at x = 1. The derivative is undefined at x = 1, so it is positive on the open interval x > 1. l2-curve-sketching.drill-07 was fixed. The source said squaring removes a leftover sign after shifting by pi. In fact, tan(x + pi) equals tan(x) exactly. l2-curve-sketching.drill-09 was fixed. The source referred to x^3 changing sign. Inflection is established because its second derivative changes sign.
    The twelve curve discussions are exam exercises on the curve-sketching node, each re-derived, and the twelve drills are short exercises marked as a whole. The eight-step write-up order and the ten-item checklist are on that node.
