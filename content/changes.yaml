- date: "2026-10-12"
  title: Lecture 3, Taylor and integration basics
  text: |
    Real powers, Taylor polynomials, Taylor composition, Riemann sums, the fundamental theorem, substitution, and integration by parts are written out at full depth and marked reviewed. Each node has the lecture's formal statement, a worked example, a guided example, traps, a basic-to-exam ladder, cards, and sheet items. Harvested exercises and cards kept their identifiers.
    The quarter-circle substitution is taught with value pi/4. The antiderivative of cos(2x)/2 is sin(2x)/4. A trap differentiates the version with sin(2x)/2, which fails, and notes that both versions evaluate to pi/4 on [0, pi/2] because sin(2x) vanishes at the endpoints. The lecture page writes pi/4. The inventory line that said pi/y was a misreading of that 4.
    Taylor composition substitutes u = cos x - 1 into ln(1 + u). The order-2 polynomial is -x^2/2. Putting y = x^2 into sqrt(1 + y) gives 1 + x^2/2 - x^4/8 plus a small term of order 4.
    Traps on integration by parts differentiate x ln x + x and -x ln x - x. Neither derivative is the integrand. The antiderivative of ln x is x ln x - x. The antiderivative of -ln x is -x ln x + x.
    The Taylor and Riemann viewers from the one-variable visuals work are not registered in this tree, so these nodes do not carry a visual block.
  nodes: [l3-real-powers, l3-taylor, l3-taylor-composition, l3-riemann-sums, l3-fundamental-theorem, l3-substitution, l3-integration-by-parts]
- date: "2026-10-12"
  title: Lecture 1 nodes
  text: |
    The nine lecture 1 nodes are written at full depth. Each method has a worked example, and each node has a guided example, a three-tier exercise ladder, and about ten cards.

    Epsilon-delta definitions, the geometric proof of sin x / x, the construction of e, and hyperbolic functions sit in going-deeper blocks. L'Hopital practice and the intermediate value theorem exercises stay on lecture 2. The intermediate value theorem is stated once on the continuity node.

    Lecture 1 notes write the reciprocal derivative with -u in the numerator. The correct formula is -u'/u^2. The real-power line writes f(x) = p x^{p-1}. The derivative is f'(x) = p x^{p-1}. The functions-and-graphs booklet, PDF page 15, draws a right shift by 2 of (1, 1) at (3, 1) and labels that point (1, 3). The shifted point is (3, 1).
