- date: "2026-10-12"
  title: Lecture 4
  text: |
    The nine lecture 4 nodes now teach space geometry and functions of several variables from the boards, the notebook page, handout chapters 12 and 14.1, and sheet 2 exercises 1 and 2.
    The quadric and level-set nodes include the quadric viewer. Sheet 2 exercise 1 reads the contour step as 10 m, because one unlabeled curve sits between the labels 200 and 220. Exercise 2 names the five surfaces and their level sets.
    A few source formulas are taught in corrected form. The one-sheet equation is \(z^{2} = x^{2} + y^{2} - 1\), with the separate condition \(x^{2} + y^{2} \ge 1\). The cut \(y = 0\) uses the points \((x, 0, z)\). The point-to-plane distance keeps the absolute value. The paraboloid \(z = x^{2} + y^{2}\) opens along the vertical \(z\)-axis.
