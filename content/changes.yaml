- date: "2026-10-12"
  title: Lecture 6 critical points and optimisation
  text: |
    The seven lecture 6 nodes are written at full depth and marked reviewed: critical points, the second derivative test, the D = 0 case settled by sections, parameter families, global extrema on closed regions, worded optimisation and Lagrange multipliers. Each node has the handout statement with its source, a worked example, a guided example, traps, a basic-to-exam ladder, about ten cards and sheet items. The critical-point viewer sits on the critical-point and parameter-family nodes, and the constraint viewer sits on the Lagrange node. Handout exercises 14.7.1 to 14.7.19 and 14.8.5 to 14.8.10, 14.8.13 and 14.8.16, sheet 2 exercises 7 to 11, the 2022 home assignment and the critical-point and optimisation questions of the finals, retake and mocks keep their identifiers and provenance labels. The lecture has not taken place, so every formal statement follows the handout and is marked provisional until the lecture 6 notes arrive.

    The Hessian test in the lecture 5 notes is written with f_xx >= 0 or <= 0 and without D > 0 on the minimum and maximum lines. The nodes teach D > 0 first, then the sign of f_xx, and a trap shows f_xx alone calling the saddle of x^2 - y^2 a minimum. Two Lagrange constraints sit in a going-deeper block. The long modelling problems of sheet 2 stay with their own ticket. The hidden stand-in node for the Hessian test is kept as a test fixture and does not appear in the course.
  nodes: [l6-critical-points, l6-second-derivative-test, l6-degenerate-case, l6-parameter-families, l6-global-extrema, l6-worded-optimisation, l6-lagrange]
- date: "2026-10-12"
  title: Lecture 7 double integrals
  text: |
    Double integrals over rectangles and general regions, the order of integration, average value, volumes and polar integrals now have handout statements, worked and guided examples, traps, cards, sheet items and a three-tier exercise ladder. Those six nodes are reviewed. The formal wording is the handout's, and it is provisional until lecture 7 notes exist.

    Sheet 3 exercise 1.14, with integrand x minus the square root of y, evaluates to -pi/4. The 2022 final average of sin(x + y) on the triangle x + 2y = 2 is 2 sin 1 - sin 2. The handwritten key line reads 2 - 2 sin 2, and the exercise records that discrepancy. Example 15.1.3 prints an intermediate antiderivative that drops a minus. Example 15.2.2 prints a primitive that fails to evaluate to 8 pi/3 - 32/9. The nodes teach the consistent antiderivatives. Both printed final values are right: 1/3, and 8 pi/3 - 32/9.
  nodes: [l7-double-integrals-rectangles, l7-general-regions, l7-order-of-integration, l7-average-value, l7-volumes, l7-polar-integrals]
- date: "2026-10-12"
  title: Lecture 3 techniques, improper integrals, area and densities
  text: |
    Trigonometric powers and substitutions, partial fractions, improper integrals, area between curves, probability densities and numerical integration are written at full depth and marked reviewed. The handout supplies the statements for powers, substitutions, partial fractions, area, densities and the trapezoid and Simpson rules. Improper integrals are written as limits, and each example says whether the integral converges or diverges. A density example on the half-line normalises the constant, then computes E(X), then P(X > 2). Partial fractions stay short, and the exam weight remains not-examined. Error bounds, the Gaussian constant and the defective-chips story sit in going-deeper blocks.

    Lecture 3 writes a density as an integral from 0 to infinity equal to 1, with the sign condition absent, and it sends every improper cutoff to plus infinity. The nodes teach the corrected statements. Handout example 8.6.4 prints the fourth derivative of e to the minus x squared with leading power 2. The leading power is 4, and the bound 12 on [0, 1] still holds.
  nodes: [l3-trig-integrals, l3-partial-fractions, l3-improper-integrals, l3-area-between-curves, l3-probability-densities, l3-numerical-integration]
- date: "2026-10-12"
  title: Lecture 2 derivative tools and curve sketching
  text: |
    Filled the lecture 2 nodes on inverse derivatives, implicit differentiation, L'Hopital, asymptotes, monotonicity, concavity and the full curve-sketching procedure. Formal statements follow the lecture notes and the handout. The inflection rule is the sign-change form. The cube identity for a real two-thirds power is taught as (x^{2/3})^3 = x^2, with a trap for the wrong version. Sheet 1 exercise 5 is on the curve-sketching node. Orthogonal trajectories and the fifty-exercise L'Hopital drill sit in going-deeper blocks.
