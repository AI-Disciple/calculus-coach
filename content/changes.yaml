- date: "2026-10-12"
  title: Lecture 5 notes and practice
  text: |
    Lecture 5 now has the limit via norms, partials, Clairaut, the tangent plane, the directional derivative, steepest ascent, both chain rules, and the Hessian matrix with D. The min/max/saddle test stays in lecture 6.
    Handout set 14.5 and sheet 2 exercises 3 to 6 have worked solutions. Items 14.5.17 and 14.5.21 have no printed answer. The printed answer of 14.5.1 is 9 sqrt(5)/5, the slope per unit distance. The dot product with the vector (2, 1) is 9.
    The tangent-plane and gradient viewers are on those nodes. Past-paper tangent, chain-rule, and steepest-descent exercises already prepared for the older finals sit on the same nodes.
    Two lecture-note formulas are taught in corrected form. The x-partial step is (x, y) plus epsilon times (1, 0). The path (t squared, t to the fourth) covers only the half parabola x >= 0. Sheet 2 exercise 3.4 is the function f(x, y) = sqrt(1 - x^2 - y^2).
