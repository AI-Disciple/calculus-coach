- date: "2026-10-12"
  title: Faithfulness audit corrections
  text: |
    A sampled comparison of lectures 1 to 8 with their sources found a few errors, now fixed. The final 2025 exercise 4a integrand is the square root of x times y squared, with value 14/9. The mixed-partials theorem requires continuous second partials, and a limit that exists gives a partial derivative, not differentiability. The lecture frame figure puts x down-left. The real-power node teaches that the cube of x to the 2/3 equals x squared.
    Lecture 6 gains records for handout 14.8.1 to 4, 11, 12, 14, 15 and 17 and a viewer on the second derivative test. A discrepancy note on Home Assignment 2022 exercise 8 is removed, because the key agrees with the verified value. Optional going-deeper blocks were added to lecture 4, 6 and 7 nodes. Several handout page citations and example labels were corrected.
