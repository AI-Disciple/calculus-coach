# Source registry: every unique piece of the student's course material that content may cite.
# Node and block references use { source: <id>, page: <page>, section: <section> }. See docs/content-format.md.
#
# pageNumbering says what a cited page means:
#   pdf      the 1-based page of the PDF file
#   printed  the page number printed in the book; printedPages converts it (PDF page = printed page - offset)
#   none     a single image, cited without a page
# sections (printed sources only) gives the PDF page where each section starts, so a section reference opens there.

- id: handout
  title: Handout
  kind: handout
  pageNumbering: printed
  printedPages:
    - { from: 5, to: 11, offset: 0 }
    - { from: 13, to: 105, offset: 0 }
    - { from: 107, to: 117, offset: 0 }
    - { from: 119, to: 195, offset: 0 }
    - { from: 223, to: 232, offset: 27 }
